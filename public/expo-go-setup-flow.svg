<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">Expo Go setup flow</title>
  <desc id="description">A computer runs Node.js and the Expo development server, then a phone scans its QR code with Expo Go over Wi-Fi.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#092923"/>
      <stop offset="1" stop-color="#164044"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f7f2"/>
      <stop offset="1" stop-color="#dfe9d8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" rx="32" fill="url(#background)"/>
  <text x="600" y="74" fill="#d0e978" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">Preview your app with Expo Go</text>
  <text x="600" y="112" fill="#dfe7d6" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">Your computer runs the project. Your phone opens the preview.</text>
  <rect x="100" y="178" width="410" height="300" rx="22" fill="#f3f3e9"/>
  <rect x="126" y="204" width="358" height="218" rx="10" fill="url(#screen)"/>
  <rect x="126" y="204" width="358" height="38" rx="10" fill="#d0e978"/>
  <circle cx="151" cy="223" r="6" fill="#31594b"/>
  <circle cx="171" cy="223" r="6" fill="#31594b"/>
  <circle cx="191" cy="223" r="6" fill="#31594b"/>
  <text x="154" y="278" fill="#173a32" font-family="Arial, sans-serif" font-size="22" font-weight="700">Computer / laptop</text>
  <text x="154" y="316" fill="#405d53" font-family="Arial, sans-serif" font-size="18">Node.js + npm</text>
  <text x="154" y="345" fill="#405d53" font-family="Arial, sans-serif" font-size="18">Expo project + editor</text>
  <rect x="154" y="366" width="220" height="34" rx="7" fill="#092923"/>
  <text x="169" y="389" fill="#d0e978" font-family="Consolas, monospace" font-size="15">npx expo start</text>
  <path d="M80 480h450l-38 34H118z" fill="#bac8b9"/>
  <text x="305" y="557" fill="#dfe7d6" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">1. Start the development server</text>
  <path d="M565 300h92" stroke="#d0e978" stroke-width="6" stroke-linecap="round"/>
  <path d="m643 282 22 18-22 18" fill="none" stroke="#d0e978" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M581 264c18-18 42-18 60 0M593 278c11-11 25-11 36 0M605 291c4-4 8-4 12 0" fill="none" stroke="#d0e978" stroke-width="5" stroke-linecap="round"/>
  <text x="600" y="350" fill="#dfe7d6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">Wi-Fi</text>
  <rect x="727" y="166" width="230" height="346" rx="34" fill="#071d1b" stroke="#bac8b9" stroke-width="5"/>
  <rect x="746" y="198" width="192" height="276" rx="18" fill="#f7f7f2"/>
  <rect x="802" y="178" width="80" height="10" rx="5" fill="#bac8b9"/>
  <text x="842" y="238" fill="#173a32" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Expo Go</text>
  <rect x="786" y="260" width="112" height="112" fill="#fff" stroke="#bac8b9" stroke-width="2"/>
  <g fill="#092923">
    <path d="M797 271h30v30h-30zm7 7v16h16v-16zm49-7h30v30h-30zm7 7v16h16v-16zm-63 49h30v30h-30zm7 7v16h16v-16z"/>
    <path d="M839 271h8v8h-8zm0 16h8v8h-8zm-8 8h8v8h-8zm16 0h8v8h-8zm8 8h8v8h-8zm16 8h8v8h-8zm-32 8h8v8h-8zm16 8h8v8h-8zm16 8h8v8h-8zm-32 8h8v8h-8zm16 8h8v8h-8z"/>
  </g>
  <text x="842" y="406" fill="#405d53" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Scan the QR code</text>
  <text x="842" y="430" fill="#405d53" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">to open your project</text>
  <text x="842" y="557" fill="#dfe7d6" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">2. Open it on your phone</text>
  <rect x="1000" y="205" width="145" height="178" rx="18" fill="#d0e978"/>
  <path d="m1030 294 28 27 57-66" fill="none" stroke="#173a32" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1072" y="420" fill="#dfe7d6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">Edit code</text>
  <text x="1072" y="445" fill="#dfe7d6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">and preview</text>
  <text x="1072" y="557" fill="#dfe7d6" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">3. Fast Refresh</text>
</svg>
