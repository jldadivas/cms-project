<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">Install Node.js on Windows for Expo</title>
  <desc id="description">Download the official Node.js LTS MSI, install Node.js with npm and PATH, verify both commands, and start an Expo project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#092923"/>
      <stop offset="1" stop-color="#164044"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" rx="30" fill="url(#bg)"/>
  <text x="600" y="70" fill="#f5f3e8" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">Get your computer ready for Expo</text>
  <text x="600" y="108" fill="#d0e978" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">Node.js includes npm — install, verify, then create your project</text>
  <g font-family="Arial, sans-serif">
    <rect x="62" y="160" width="242" height="260" rx="22" fill="#f3f3e9"/>
    <circle cx="94" cy="194" r="19" fill="#d0e978"/>
    <text x="94" y="201" fill="#173a32" font-size="17" font-weight="700" text-anchor="middle">1</text>
    <text x="123" y="201" fill="#173a32" font-size="20" font-weight="700">Download</text>
    <rect x="92" y="234" width="182" height="82" rx="13" fill="#dce9d8"/>
    <text x="183" y="270" fill="#1f6c54" font-size="26" font-weight="700" text-anchor="middle">node.js</text>
    <text x="183" y="297" fill="#405d53" font-size="15" text-anchor="middle">LTS · Windows .msi</text>
    <text x="183" y="356" fill="#56776a" font-size="15" text-anchor="middle">Use nodejs.org</text>
    <text x="183" y="382" fill="#56776a" font-size="15" text-anchor="middle">Choose a supported LTS</text>

    <path d="M319 290h42" stroke="#d0e978" stroke-width="5" stroke-linecap="round"/>
    <path d="m350 278 14 12-14 12" fill="none" stroke="#d0e978" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="379" y="160" width="242" height="260" rx="22" fill="#f3f3e9"/>
    <circle cx="411" cy="194" r="19" fill="#d0e978"/>
    <text x="411" y="201" fill="#173a32" font-size="17" font-weight="700" text-anchor="middle">2</text>
    <text x="440" y="201" fill="#173a32" font-size="20" font-weight="700">Install</text>
    <rect x="409" y="234" width="182" height="82" rx="13" fill="#dce9d8"/>
    <path d="M500 250v37m-14-14 14 14 14-14" fill="none" stroke="#31594b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="500" y="307" fill="#405d53" font-size="13" text-anchor="middle">npm + PATH enabled</text>
    <text x="500" y="356" fill="#56776a" font-size="15" text-anchor="middle">Run the .msi wizard</text>
    <text x="500" y="382" fill="#56776a" font-size="15" text-anchor="middle">Keep beginner defaults</text>

    <path d="M636 290h42" stroke="#d0e978" stroke-width="5" stroke-linecap="round"/>
    <path d="m667 278 14 12-14 12" fill="none" stroke="#d0e978" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="696" y="160" width="242" height="260" rx="22" fill="#f3f3e9"/>
    <circle cx="728" cy="194" r="19" fill="#d0e978"/>
    <text x="728" y="201" fill="#173a32" font-size="17" font-weight="700" text-anchor="middle">3</text>
    <text x="757" y="201" fill="#173a32" font-size="20" font-weight="700">Verify</text>
    <rect x="726" y="234" width="182" height="82" rx="13" fill="#092923"/>
    <text x="744" y="268" fill="#d0e978" font-family="Consolas, monospace" font-size="15">node -v</text>
    <text x="744" y="294" fill="#d0e978" font-family="Consolas, monospace" font-size="15">npm -v</text>
    <text x="817" y="356" fill="#56776a" font-size="15" text-anchor="middle">Open a fresh terminal</text>
    <text x="817" y="382" fill="#56776a" font-size="15" text-anchor="middle">Both print a version</text>

    <path d="M953 290h42" stroke="#d0e978" stroke-width="5" stroke-linecap="round"/>
    <path d="m984 278 14 12-14 12" fill="none" stroke="#d0e978" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1013" y="160" width="125" height="260" rx="22" fill="#d0e978"/>
    <circle cx="1045" cy="194" r="19" fill="#173a32"/>
    <text x="1045" y="201" fill="#d0e978" font-size="17" font-weight="700" text-anchor="middle">4</text>
    <text x="1075" y="201" fill="#173a32" font-size="20" font-weight="700">Expo</text>
    <path d="M1051 260h51v39h-51z" fill="#173a32" rx="5"/>
    <text x="1076" y="284" fill="#d0e978" font-family="Consolas, monospace" font-size="12" text-anchor="middle">npx expo</text>
    <text x="1076" y="356" fill="#31594b" font-size="14" text-anchor="middle">Create app</text>
    <text x="1076" y="382" fill="#31594b" font-size="14" text-anchor="middle">Scan QR code</text>
  </g>
  <text x="600" y="475" fill="#dfe7d6" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">If node or npm is not recognized, reopen your terminal or restart Windows so PATH reloads.</text>
</svg>
